<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>ゲーム中の表示</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="root" class="is-list">
  <!-- mini: one line, click to open the list -->
  <button type="button" class="mini" id="mini" title="クリックでリスト表示">
    <span class="st" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1c.6 5.4 2.4 8.4 11 11-8.6 2.6-10.4 5.6-11 11-.6-5.4-2.4-8.4-11-11 8.6-2.6 10.4-5.6 11-11z"/></svg></span>
    <b id="mDays">–</b><span id="mDone"></span><span class="mt" id="mTimer"></span>
  </button>

  <!-- list -->
  <section class="card" id="card">
    <header class="hd">
      <span class="ttl"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1c.6 5.4 2.4 8.4 11 11-8.6 2.6-10.4 5.6-11 11-.6-5.4-2.4-8.4-11-11 8.6-2.6 10.4-5.6 11-11z"/></svg>きょうのやること</span>
      <span class="days" id="days">–</span>
      <span class="tools">
        <button type="button" data-cmd="opacity-" title="うすくする" aria-label="うすくする">−</button>
        <button type="button" data-cmd="opacity+" title="こくする" aria-label="こくする">＋</button>
        <button type="button" data-cmd="mode:mini" title="ちび表示にする" aria-label="ちび表示にする">▁</button>
        <button type="button" data-cmd="open-main" title="メイン画面を開く" aria-label="メイン画面を開く">⤢</button>
        <button type="button" data-cmd="hide" title="隠す（Ctrl+Alt+G）" aria-label="隠す">×</button>
      </span>
    </header>
    <div class="prog"><span class="bar"><i id="bar"></i></span><span id="count">0 / 0</span></div>
    <div class="list" id="list"></div>
    <p class="timers" id="timers" hidden></p>
    <footer class="ft"><span id="hint">Ctrl+Alt+M でクリックすり抜け</span><span id="op"></span></footer>
  </section>
  <div class="through" id="through" hidden>すり抜け中（Ctrl+Alt+M で戻す）</div>
</div>
<script src="overlay.js"></script>
</body>
</html>
