# When updates/update.json gets a new version, build the full Windows zip and publish it as a GitHub Release
# (the download page for new users). Installed apps update from updates/ directly and do not need this.
# Runs on Windows so rcedit can put the app icon and name into GenshinTracker.exe.
name: 配布用zipを作る
on:
  push:
    branches: [main]
    paths: ['updates/update.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          V=$(jq -r .version updates/update.json)
          NOTES=$(jq -r .notes updates/update.json)
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V is already published"; exit 0; fi
          T="$RUNNER_TEMP"
          EV=31.7.7
          curl -sSLf -o "$T/electron-win.zip" "https://github.com/electron/electron/releases/download/v$EV/electron-v$EV-win32-x64.zip"
          curl -sSLf -o "$T/SHASUMS256.txt" "https://github.com/electron/electron/releases/download/v$EV/SHASUMS256.txt"
          EXPECT=$(grep "electron-v$EV-win32-x64.zip" "$T/SHASUMS256.txt" | cut -c1-64)
          echo "$EXPECT  $T/electron-win.zip" | sha256sum -c -
          curl -sSLf -o "$T/rcedit-x64.exe" "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe"
          ELECTRON_WIN_ZIP="$T/electron-win.zip" RCEDIT="$T/rcedit-x64.exe" python tools/build.py "$NOTES"
          printf '%s\n\n%s\n\n%s\n' \
            "**はじめての方**：下の「GenshinTracker-Windows-$V.zip」をダウンロードして展開し、中の GenshinTracker.exe を開いてください。" \
            "インストール済みの方は、アプリが自動で更新するので何もしなくて大丈夫です。" \
            "$NOTES" > "$T/notes.md"
          gh release create "v$V" "dist/release-$V/GenshinTracker-Windows-$V.zip" --title "$V" --notes-file "$T/notes.md" --latest
